[package]
name = "t-bank-sdk"
version = "0.3.0"
edition = "2024"
authors = ["Danila Volkov <noxlovette@proton.me>"]
description = "Async Rust SDK for T-Bank's (T-Business) Internet Acquiring API"
license = "MIT"
repository = "https://github.com/noxlovette/t-bank-sdk"
homepage = "https://github.com/noxlovette/t-bank-sdk"
documentation = "https://docs.rs/t-bank-sdk"
readme = "README.md"
keywords = ["tbank", "acquiring", "payments", "sdk", "tinkoff"]
categories = ["api-bindings", "finance"]
exclude = [".github/"]

[features]
serde = ["dep:serde", "dep:serde_json", "chrono/serde", "url/serde"]
utoipa = ["dep:utoipa"]

[dependencies]
tracing-subscriber = "0.3.23"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4" }
sha2 = "0.10"
url = { version = "2.5.8" }
tracing = "0.1.44"
thiserror = "2"
strum = { version = "0.28.0", features = ["derive"] }
utoipa = { version = "5.5.0", features = ["chrono"], optional = true }

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "server"
required-features = ["serde"]

[[test]]
name = "tls_trust"
required-features = ["serde"]
